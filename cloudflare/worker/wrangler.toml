name = "papergen"
main = "src/index.js"
compatibility_date = "2026-10-21"
workers_dev = true

# Replace database_id after: bun x wrangler d1 create papergen
[[d1_databases]]
binding = "DB"
database_name = "papergen"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "exampapers"

[vars]
SUBJECT = "CSC662"
GALLERY_TTL_DAYS = "7"
MAX_GALLERY_ENTRIES = "100"

[triggers]
crons = ["0 3 * * *"]

[observability]
enabled = true

# Add a custom domain route when the zone is ready:
# routes = [{ pattern = "papers.example.com/*", zone_name = "example.com" }]
